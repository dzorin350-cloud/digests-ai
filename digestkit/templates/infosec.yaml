# Шаблон: дайджест ИБ (бывший стенд «Дайджест ИБ» — его код лежит в ветке legacy/infosec-stand).
# Два блока: технический (атаки и уязвимости) и для руководства. Источники проверены в октябре 2026,
# перед запуском прогоните `digest sources check <id>`.
title: Дайджест ИБ
language: ru
timezone: Europe/Moscow
reader: >-
  Специалист и руководитель по ИБ российской компании (энергетика и промышленность). Нужны атаки на
  российские организации, уязвимости с эксплойтами в распространённом ПО, крупные инциденты и изменения
  регулирования. Без маркетинга вендоров и общих советов.
style: Коротко, по делу, с CVE и названиями группировок, без оценочных слов.
remind_after_days: null

cadences:
  daily: {enabled: true, max_age_hours: 48}
  weekly: {enabled: true, weekday: 0}     # понедельник
  monthly: {enabled: true, day: 1}

delivery:
  file: true
  email: []                 # ["me@example.com"]
  telegram_chat_id: null    # "123456789"

blocks:
  - id: threats
    title: Атаки и уязвимости
    ref: T
    brief: >-
      Конкретные атаки, кампании и группировки (особенно против организаций РФ, энергетики, промышленности,
      АСУ ТП), уязвимости с эксплойтами или в каталоге CISA KEV, критичные патчи распространённого ПО
      (Windows, Exchange, VMware, Fortinet, Citrix, 1С, Bitrix). Не нужны: обзоры техник без кампании,
      вебинары, реклама продуктов.
    include: [CVE, эксплойт, APT, шифровальщик, ransomware, KEV, АСУ ТП, SCADA]
    exclude: [вебинар, скидка, конкурс]
    max_items: 7
    sources:
      - {url: "https://rt-solar.ru/solar-4rays/blog/", kind: "html", name: "Solar 4RAYS — блог", trust: 0.9, selectors: {link_pattern: "^https://rt-solar\\.ru/solar-4rays/blog/\\d+/"}}
      - {url: "https://bi.zone/expertise/blog/", kind: "html", name: "BI.ZONE — блог", trust: 0.9, selectors: {link_pattern: "^https://bi\\.zone/expertise/blog/[a-z0-9-]{10,}/$"}}
      - {url: "https://habr.com/ru/hubs/infosecurity/articles/", feed_url: "https://habr.com/ru/rss/hubs/infosecurity/articles/?fl=ru", kind: "rss", name: "Хабр — ИБ (статьи)", trust: 0.6}
      - {url: "https://www.f6.ru/blog/", kind: "html", name: "F6 — блог", trust: 0.9, selectors: {link_pattern: "^https://www\\.f6\\.ru/blog/[a-z0-9-]{4,}/$"}}
      - {url: "https://securelist.ru/", feed_url: "https://securelist.ru/feed/", kind: "rss", name: "Securelist (Kaspersky)", trust: 0.9}
      - {url: "https://unit42.paloaltonetworks.com/category/threat-research/", feed_url: "https://unit42.paloaltonetworks.com/category/threat-research/feed/", kind: "rss", name: "Unit 42 — Threat Research", trust: 0.85}
      - {url: "https://cloud.google.com/blog/topics/threat-intelligence", feed_url: "https://feeds.feedburner.com/threatintelligence/pvexyqv7v0v", kind: "rss", name: "Google Cloud — Threat Intelligence", trust: 0.85}
      - {url: "https://www.ctfiot.com/blog", feed_url: "https://www.ctfiot.com/feed/", kind: "rss", name: "CTFIoT — блог", trust: 0.5}
      - {url: "https://www.fortinet.com/blog/threat-research", kind: "html", name: "Fortinet — Threat Research", trust: 0.85, selectors: {link_pattern: "^https://www\\.fortinet\\.com/blog/threat-research/[a-z0-9-]{10,}$"}}
      - {url: "https://blog.xlab.qianxin.com/", feed_url: "https://blog.xlab.qianxin.com/rss/", kind: "rss", name: "XLab Qianxin", trust: 0.8}
