  - id: mgmt
    title: ИБ для руководства
    ref: M
    brief: >-
      Крупные инциденты и утечки, атаки на критическую инфраструктуру, финансовые и репутационные потери,
      законы и требования регуляторов (ФСТЭК, Минцифры, ЦБ), штрафы и суды, громкие кадровые события.
      Без технических деталей.
    exclude: [вебинар, конкурс]
    max_items: 5
    sources:
      - {url: "https://ria.ru/product_informatsionnaya-bezopasnost/", kind: "html", name: "РИА Новости — ИБ", trust: 0.65, selectors: {link_pattern: "^https://ria\\.ru/20\\d{6}/[a-z0-9-]+\\.html$"}}
