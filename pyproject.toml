[project]
name = "ai-digests"
version = "0.2.0"
description = "Agent-first personal news digests with memory: daily news, weekly and monthly reviews, any topics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "trafilatura>=1.12",
  "pyyaml>=6.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "markdown>=3.6",
  "tzdata; sys_platform == 'win32'",  # zoneinfo has no system database on Windows
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "types-Markdown"]

[project.scripts]
digest = "digestkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["digestkit*"]

[tool.setuptools.package-data]
digestkit = ["prompts/*.md", "templates/*.yaml"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
